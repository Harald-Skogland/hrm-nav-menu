<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>hrm-nav-menu demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #f5f7f9; }
    .content-area {
      margin: 16px;
      min-height: calc(100vh - 64px - 32px);
      display: flex;
    }
    .page-box {
      flex: 1;
      background: #ffffff;
      border-radius: 4px;
    }

    /* ── Config widget (dev-only tool for menu variant planning) ── */
    .config-widget {
      position: fixed;
      /* Collapsed: shifted so the Config button occupies the same spot
         as the Close button does in the open state (inside widget padding). */
      bottom: 48px;
      right: 48px;
      z-index: 1000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1a1a1a;
    }
    .config-content { display: none; }
    .config-widget.open {
      bottom: 32px;
      right: 32px;
      background: #f5f5f7;
      border: 1px solid #d5d5da;
      border-radius: 12px;
      padding: 16px;
      width: 520px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .config-widget.open .config-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .config-widget.open .config-button {
      align-self: flex-end;
    }
    .config-heading {
      font-weight: 600;
      font-size: 13px;
      line-height: 18px;
      color: #1a1a1a;
      margin: 0 0 4px;
    }
    .config-tip {
      font-size: 12px;
      line-height: 20px;
      font-style: italic;
      color: #4a4a4f;
      margin: 4px 0 0;
    }
    .config-tip .config-shortcut {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #ffffff;
      border: 1px solid #d5d5da;
      border-radius: 4px;
      padding: 0 4px;
      font-size: 11px;
      white-space: nowrap;
    }
    .config-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      user-select: none;
    }
    .config-row input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }
    .config-row input[type="checkbox"]:disabled + span {
      opacity: 0.45;
    }
    .config-children {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 20px;
      margin-top: 2px;
    }
    .config-columns {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .config-col-presets {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-shrink: 0;
      min-width: 124px;
    }
    .config-col-version {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 0 0 148px;
      min-width: 0;
    }
    .config-col-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    /* Preset lock: content-column checkboxes look disabled but remain clickable.
       Clicking one applies the toggle and switches the preset back to Custom. */
    .config-widget.preset-locked .config-col-content label,
    .config-widget.preset-locked .config-col-content input[type="checkbox"] {
      cursor: not-allowed;
    }
    .config-widget.preset-locked .config-col-content input[type="checkbox"] + span {
      opacity: 0.45;
    }
    .config-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 120px;
      padding: 10px 18px;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid #d5d5da;
      border-radius: 9999px;
      color: #1a1a1a;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: box-shadow 0.2s ease;
      white-space: nowrap;
    }
    .config-button:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
    .config-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .config-row.flash-pulse { animation: configFlash 900ms ease-in-out; }
    @keyframes configFlash {
      0%, 33%, 66%, 100% { background-color: transparent; }
      16.5%, 49.5%, 83% { background-color: #fde68a; }
    }
  </style>
  <script src="./hrm-nav-menu.js?v=65" defer></script>
  <script src="./hrm-nav-menu-panel.js?v=65" defer></script>
</head>
<body>

  <hrm-nav-menu company="Acme Corp"></hrm-nav-menu>

  <hrm-nav-menu-panel
    module-name="HRM"
    user-name="Anna Andersson"
    modules='[
      {"id":"approval","name":"Approval"}
    ]'
  ></hrm-nav-menu-panel>

  <main class="content-area" id="content-area">
    <div class="page-box"></div>
  </main>

  <!-- Config widget: dev-only tool for switching menu variants. Not part of the shipping UI. -->
  <div class="config-widget" id="config-widget">
    <div class="config-content">
      <div class="config-columns">
        <div class="config-col-version">
          <p class="config-heading">Version</p>
          <div class="config-row"><label><input type="radio" name="version" value="combined" checked><span>HRM as one module</span></label></div>
          <p class="config-tip">All navigation for all services available as expandable items</p>
          <div class="config-row"><label><input type="radio" name="version" value="separate"><span>HRM as separate modules</span></label></div>
          <p class="config-tip">Each service as a separate navigation point and without disclosing sub-pages of other services.</p>
        </div>
        <div class="config-col-presets">
          <p class="config-heading">Presets</p>
          <div class="config-row"><label><input type="radio" name="preset" value="custom" checked><span>Custom</span></label></div>
          <div class="config-row"><label><input type="radio" name="preset" value="payroll-admin"><span>Payroll admin</span></label></div>
          <div class="config-row"><label><input type="radio" name="preset" value="manager"><span>Manager</span></label></div>
          <div class="config-row"><label><input type="radio" name="preset" value="employee"><span>Employee</span></label></div>
        </div>
        <div class="config-col-content">
          <p class="config-heading">Content enabled</p>
          <div class="config-row" data-row="approval">
            <label><input type="checkbox" data-cfg="approval" checked><span>Approval</span></label>
          </div>
          <div class="config-row" data-row="dottie">
            <label><input type="checkbox" data-cfg="dottie" checked><span>Dottie</span></label>
          </div>
          <div class="config-row" data-row="hrm">
            <label><input type="checkbox" data-cfg="hrm" checked><span>HRM</span></label>
          </div>
          <div class="config-children">
            <div class="config-row" data-row="hrm.calendar"><label><input type="checkbox" data-cfg="hrm.calendar" checked><span>Calendar</span></label></div>
            <div class="config-row" data-row="hrm.dottie"><label><input type="checkbox" data-cfg="hrm.dottie" checked><span>Dottie</span></label></div>
            <div class="config-row" data-row="hrm.employees"><label><input type="checkbox" data-cfg="hrm.employees" checked><span>Employees</span></label></div>
            <div class="config-row" data-row="hrm.expense"><label><input type="checkbox" data-cfg="hrm.expense" checked><span>Expense</span></label></div>
            <div class="config-row" data-row="hrm.payroll"><label><input type="checkbox" data-cfg="hrm.payroll" checked><span>Payroll</span></label></div>
            <div class="config-row" data-row="hrm.payroll-portal"><label><input type="checkbox" data-cfg="hrm.payroll-portal" checked><span>Payroll Portal</span></label></div>
            <div class="config-row" data-row="hrm.payslip"><label><input type="checkbox" data-cfg="hrm.payslip" checked><span>Payslip</span></label></div>
          </div>
          <div class="config-row" data-row="fake-context-modules">
            <label><input type="checkbox" data-cfg="fake-context-modules"><span>Display inactive context modules</span></label>
          </div>
          <p class="config-tip">Autopay, Autoreport, Business NXT and OSR</p>
        </div>
      </div>
      <p class="config-tip">Tip: Use <span class="config-shortcut">Command+K</span> to open menu and search ⚡</p>
    </div>
    <button class="config-button" id="config-button" type="button" aria-expanded="false">
      <svg class="config-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <span class="config-label">Config</span>
    </button>
  </div>

  <script>
    const nav   = document.querySelector('hrm-nav-menu');
    const panel = document.querySelector('hrm-nav-menu-panel');

    const HRM_ITEMS = [

    // ── Separate-mode module items (from g-sheet-csv/*-Separate-*.csv) ──
    // Each former-HRM child becomes its own top-level module, absorbing the
    // matching slices of HRM's central Reports/ and Settings/ subtrees as
    // local Reports/Settings folders. Existing page-stub ids (`set-cal-*`,
    // `rpt-cal-*`, etc.) are reused so stubs work in both versions.

    const SEP_CALENDAR_ITEMS = [
      { id: 'cal-event-registration', label: 'Event registration', tier: 1, type: 'link' },
      { id: 'cal-timesheets',         label: 'Timesheets',         tier: 1, type: 'link' },
      { id: 'cal-planned-leaves',     label: 'Planned leaves',     tier: 1, type: 'link' },
      { id: 'cal-requests-overview',  label: 'Requests overview',  tier: 1, type: 'link' },
      { id: 'cal-vacation-management',label: 'Vacation management',tier: 1, type: 'link' },
      { id: 'cal-roster',             label: 'Roster',             tier: 1, type: 'link' },
      { id: 'cal-reports', label: 'Reports', tier: 1, type: 'submenu' },
        { id: 'rpt-cal-absence-pct',       label: 'Absence in percent',      tier: 2, type: 'link' },

    // Declared early so computeBreadcrumb (called during initial loadPage)
    // can read it. Populated later from the Config widget's checkboxes.
    const configState = {};

    // Module visibility rules.
    //   Combined: HRM is always available; Approval gated by `approval`;
    //   Dottie gated by its own top-level `dottie` toggle (alongside Approval).
    //   Separate: Approval gated by `approval`; former-HRM services (Calendar,
    //   Dottie, …) gated by the HRM umbrella toggle AND their per-service
    //   `hrm.<id>` toggle. The HRM master row stays in the Config UI in both
    //   modes (Combined target = HRM module, Separate target = the group).
    function isModuleEnabled(mid) {
      if (mid === 'approval') return configState.approval !== false;
      if (mid === 'hrm')      return true;
      if (mid === 'dottie' && versionMode === 'combined') return configState.dottie !== false;
      if (configState.hrm === false) return false;
      return configState[`hrm.${mid}`] !== false;
    }

    // Default Combined mode: pay-overview lives inside the HRM module.
    let activeModule = 'hrm';

    // Mutable view of items shown in the panel; reflects active module + config filter.
    let visibleItems = HRM_ITEMS;
    panel.setAttribute('items', JSON.stringify(annotateNewTabs(visibleItems)));

    nav.addEventListener('hrm-menu-toggle',   () => panel.toggleAttribute('open'));
    nav.addEventListener('hrm-company-click', () => console.log('company selector clicked'));
    nav.addEventListener('hrm-feedback',      () => console.log('feedback clicked'));
    nav.addEventListener('hrm-help',          () => console.log('help clicked'));
    nav.addEventListener('hrm-ai',            () => console.log('AI clicked'));
    nav.addEventListener('hrm-notifications', () => console.log('notifications clicked'));
    nav.addEventListener('hrm-breadcrumb-child', (e) => {
      const id = e.detail.id;
      // Fake modules in the VSN dropdown have no behavior beyond hover.
      if (FAKE_MODULE_IDS.has(id)) return;
      // Dottie is an isolated context in both modes: clicking it from any
      // other module opens a new tab carrying the active version. Combined
      // includes the explicit `module=dottie` hint so the new tab lands in
      // the Dottie module on reload.
      if (id === 'dottie' && activeModule !== 'dottie') {
        const def = MODULE_META.dottie.defaultId;
        const url = versionMode === 'combined'
          ? `./?page=${encodeURIComponent(def)}&version=combined&module=dottie`
          : `./?page=${encodeURIComponent(def)}&version=separate`;
        window.open(url, '_blank');
        return;
      }
      // Module ids from the VSN crumb switch the active module instead of loading a page.
      if (MODULE_META[id]) {
        if (id !== activeModule) {
          activeModule = id;
          applyConfig();
          loadPage(MODULE_META[id].defaultId);
        }
        return;
      }
      // Separate-mode: handle specialLink and host-based new-tab cases.
      if (versionMode === 'separate') {
        const item = visibleItems.find(i => i.id === id);
        if (item) {
          if (item.specialLink) return; // separate-service link — behaviour pending
          if (item.hostModule && item.hostModule !== activeModule) {
            window.open(`./?page=${encodeURIComponent(id)}&version=separate&module=${encodeURIComponent(item.hostModule)}`, '_blank');
            return;
          }
        }
      }
      loadPage(id);
    });

    const contentArea = document.getElementById('content-area');

    // ── Breadcrumb: walk HRM_ITEMS ancestors by tier ──────
    // Build nested subtree (direct children of item at `idx`, recursively)
    function buildSubtree(idx) {
      const parentTier = visibleItems[idx].tier || 1;
      const children = [];
      for (let i = idx + 1; i < visibleItems.length; i++) {
        const t = visibleItems[i].tier || 1;
        if (t <= parentTier) break;
        if (t === parentTier + 1) {
          const item = visibleItems[i];
          const node = { id: item.id, label: item.label, type: item.type };
          if (versionMode === 'separate') {
            if (item.specialLink) node.newTab = true;
            else if (item.hostModule && item.hostModule !== activeModule) node.newTab = true;
          }
          if (item.type === 'submenu') {
            node.children = buildSubtree(i);
          }
          children.push(node);
        }
      }
      return children;
    }

    function computeBreadcrumb(id) {
      const idx = visibleItems.findIndex(i => i.id === id);
      if (idx < 0) return [];
      const target = visibleItems[idx];
      const path = [{ item: target, idx }];
      let needed = (target.tier || 1) - 1;
      for (let i = idx - 1; i >= 0 && needed >= 1; i--) {
        if ((visibleItems[i].tier || 1) === needed) {
          path.unshift({ item: visibleItems[i], idx: i });
          needed--;
        }
      }
      const trail = path.map(({ item, idx }) => ({
        id: item.id,
        label: item.label,
        children: buildSubtree(idx),
      }));
      // Portal-level "VSN" crumb. Its menu lists the user's enabled real
      // modules plus the (no-op) fake modules, all sorted alphabetically;
      // clicking a real one switches the active module, fakes do nothing.
      const realVsnChildren = Object.entries(MODULE_META)
        .filter(([mid]) => isModuleEnabled(mid))
        .map(([mid, m]) => {
          const node = { id: mid, label: m.name, type: 'link' };
          // Dottie is always shown as an external context — opens in a new tab
          // in both Combined and Separate, regardless of the active module.
          if (mid === 'dottie') node.newTab = true;
          return node;
        });
      const fakeVsnChildren = configState['fake-context-modules'] !== false
        ? FAKE_MODULES.map(m => ({ id: m.id, label: m.name, type: 'link' }))
        : [];
      const vsnChildren = [...realVsnChildren, ...fakeVsnChildren]
        .sort((a, b) => a.label.localeCompare(b.label));
      // Module-level crumb (e.g. "HRM"). Its menu lists every tier-1 item
      // in the active module, with deeper levels nested.
      const moduleChildren = [];
      for (let i = 0; i < visibleItems.length; i++) {
        if ((visibleItems[i].tier || 1) !== 1) continue;
        const node = {
          id: visibleItems[i].id,
          label: visibleItems[i].label,
          type: visibleItems[i].type,
        };
        if (visibleItems[i].type === 'submenu') node.children = buildSubtree(i);
        moduleChildren.push(node);
      }
      return [
        { id: 'vsn', label: 'VSN', children: vsnChildren },
        { id: `module:${activeModule}`, label: MODULE_META[activeModule].name, children: moduleChildren },
        ...trail,
      ];
    }

    // ── Page-box variation generator ─────────────────────────
    // Splits the content-area's .page-box into up to 3 horizontal + 3
    // vertical cuts along any path (BSP). Each sub-box ≥ 80px in the
    // split direction, 16px gap between siblings. Seeded by page id so
    // each page has a stable layout across visits.
    const PB_MIN = 80, PB_GAP = 16, PB_MAX_CUTS = 3, PB_MAX_TOTAL = 4, PB_STOP_PROB = 0.25;

    function pbMakeRng(seed) {
      let s = 2166136261;
      for (let i = 0; i < seed.length; i++) {
        s ^= seed.charCodeAt(i);
        s = Math.imul(s, 16777619);
      }
      return function () {
        s |= 0; s = s + 0x6D2B79F5 | 0;
        let t = Math.imul(s ^ s >>> 15, 1 | s);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function pbBuild(w, h, hLeft, vLeft, budget, rng, depth) {
      const canH = hLeft > 0 && h >= PB_MIN * 2 + PB_GAP;
      const canV = vLeft > 0 && w >= PB_MIN * 2 + PB_GAP;
      if (!canH && !canV) return { leaf: true };
      if (budget.n <= 0) return { leaf: true };
      if (depth > 0 && rng() < PB_STOP_PROB) return { leaf: true };

      const dir = (canH && canV) ? (rng() < 0.5 ? 'h' : 'v') : (canH ? 'h' : 'v');
      budget.n -= 1;

      if (dir === 'h') {
        const max = h - PB_GAP - PB_MIN;
        const topH = PB_MIN + rng() * (max - PB_MIN);
        const botH = h - PB_GAP - topH;
        return {
          split: 'column',
          ratios: [topH, botH],
          children: [
            pbBuild(w, topH, hLeft - 1, vLeft, budget, rng, depth + 1),
            pbBuild(w, botH, hLeft - 1, vLeft, budget, rng, depth + 1),
          ],
        };
      }
      const max = w - PB_GAP - PB_MIN;
      const leftW = PB_MIN + rng() * (max - PB_MIN);
      const rightW = w - PB_GAP - leftW;
      return {
        split: 'row',
        ratios: [leftW, rightW],
        children: [
          pbBuild(leftW, h, hLeft, vLeft - 1, budget, rng, depth + 1),
          pbBuild(rightW, h, hLeft, vLeft - 1, budget, rng, depth + 1),
        ],
      };
    }

    function pbRender(node) {
      if (node.leaf) {
        const el = document.createElement('div');
        el.className = 'page-box';
        el.style.flex = '1 1 0';
        return el;
      }
      const wrap = document.createElement('div');
      wrap.className = 'page-split';
      wrap.style.display = 'flex';
      wrap.style.flexDirection = node.split;
      wrap.style.gap = PB_GAP + 'px';
      wrap.style.flex = '1 1 0';
      node.children.forEach((c, i) => {
        const childEl = pbRender(c);
        childEl.style.flex = `${node.ratios[i]} ${node.ratios[i]} 0`;
        wrap.appendChild(childEl);
      });
      return wrap;
    }

    function applyPageVariation(seed) {
      const box = contentArea.querySelector('.page-box');
      if (!box) return;
      const w = contentArea.clientWidth;
      const h = contentArea.clientHeight;
      if (w < PB_MIN || h < PB_MIN) return;
      const rng = pbMakeRng(seed || 'home');
      const tree = pbBuild(w, h, PB_MAX_CUTS, PB_MAX_CUTS, { n: PB_MAX_TOTAL }, rng, 0);
      box.replaceWith(pbRender(tree));
    }

    async function loadPage(id) {
      try {
        const res = await fetch(`./pages/${id}.html`);
        if (!res.ok) throw new Error(`${res.status}`);
        contentArea.innerHTML = await res.text();
        panel.setAttribute('active-item', id);
        nav.setAttribute('breadcrumbs', JSON.stringify(computeBreadcrumb(id)));
        // Update the browser tab title — page label only.
        const item = visibleItems.find(i => i.id === id);
        if (item) document.title = item.label;
        requestAnimationFrame(() => applyPageVariation(id));
      } catch (err) {
        contentArea.innerHTML = `<!-- no page found for ${id} -->`;
        console.warn('page not found:', id, err);
      }
    }

    // Honour ?page=<id>&version=<combined|separate>&module=<id> on initial
    // load. Combined is the default; ?version=separate opts out.
    {
      const params = new URLSearchParams(location.search);
      const initialPage = params.get('page') || 'pay-overview';
      if (params.get('version') === 'separate') {
        // Opt out of the Combined default and switch to Separate.
        versionMode = 'separate';
        MODULE_META = buildModuleMeta();
        const sepRadio = document.querySelector('input[name="version"][value="separate"]');
        if (sepRadio) sepRadio.checked = true;
        // Prefer the explicit ?module=<id> hint (used when opening a
        // shared page in its host module's new tab), otherwise pick
        // whichever module owns the page id so the breadcrumb resolves
        // correctly.
        const moduleHint = params.get('module');
        if (moduleHint && MODULE_META[moduleHint]) {
          activeModule = moduleHint;
        } else {
          for (const [mid, m] of Object.entries(MODULE_META)) {
            if (m.items.find(i => i.id === initialPage)) { activeModule = mid; break; }
          }
        }
      } else {
        // Combined (default). Prefer the explicit ?module=<id> hint (used
        // when opening Dottie's isolated module in a new tab); otherwise
        // discover the owning module from MODULE_META.
        const moduleHint = params.get('module');
        if (moduleHint && MODULE_META[moduleHint]) {
          activeModule = moduleHint;
        } else {
          for (const [mid, m] of Object.entries(MODULE_META)) {
            if (m.items.find(i => i.id === initialPage)) { activeModule = mid; break; }
          }
        }
      }
      loadPage(initialPage);
    }

    // ── Config widget (dev-only menu-variant planner) ─────────
    const configWidget = document.getElementById('config-widget');
    const configButton = document.getElementById('config-button');
    const configLabel  = configButton.querySelector('.config-label');

    // Swap the tip's shortcut label for non-Mac platforms.
    const isMac = (() => {
      const d = navigator.userAgentData;
      if (d && typeof d.platform === 'string') return /mac/i.test(d.platform);
      return /Mac|iPhone|iPod|iPad/i.test(navigator.platform || navigator.userAgent || '');
    })();
    if (!isMac) {
      const sc = configWidget.querySelector('.config-shortcut');
      if (sc) sc.textContent = 'Ctrl+K';
    }

    configButton.addEventListener('click', () => {
      const open = configWidget.classList.toggle('open');
      configLabel.textContent = open ? 'Close' : 'Config';
      configButton.setAttribute('aria-expanded', String(open));
    });

    const configCheckboxes = configWidget.querySelectorAll('input[data-cfg]');
    configCheckboxes.forEach(cb => { configState[cb.dataset.cfg] = cb.checked; });

    // Presets — overwrite configState when selected; Custom preserves free-form state.
    const PRESETS = {
      'payroll-admin': {
        approval: true,
        dottie: true,
        hrm: true,
        'hrm.calendar': true,
        'hrm.dottie': true,
        'hrm.employees': true,
        'hrm.expense': true,
        'hrm.payroll': true,
        'hrm.payroll-portal': true,
        'hrm.payslip': false,
      },
      'manager': {
        approval: true,
        dottie: true,
        hrm: true,
        'hrm.calendar': true,
        'hrm.dottie': true,
        'hrm.employees': false,
        'hrm.expense': true,
        'hrm.payroll': false,
        'hrm.payroll-portal': true,
        'hrm.payslip': true,
      },
      'employee': {
        approval: false,
        dottie: true,
        hrm: true,
        'hrm.calendar': true,
        'hrm.dottie': true,
        'hrm.employees': false,
        'hrm.expense': true,
        'hrm.payroll': false,
        'hrm.payroll-portal': false,
        'hrm.payslip': true,
      },
    };
    let currentPreset = 'custom';
    let customMemory = null;

    const HRM_CHILD_LABELS = {
      'hrm.calendar':       'Calendar',
      'hrm.dottie':         'Dottie',
      'hrm.employees':      'Employees',
      'hrm.expense':        'Expense',
      'hrm.payroll':        'Payroll',
      'hrm.payroll-portal': 'Payroll Portal',
      'hrm.payslip':        'Payslip',
    };

    function filterItemsByLabel(items, hiddenLabels) {
      const out = [];
      let skipTier = null;
      for (const item of items) {
        const tier = item.tier || 1;
        if (skipTier !== null) {
          if (tier > skipTier) continue;
          skipTier = null;
        }
        if (item.type === 'submenu' && hiddenLabels.has(item.label)) {
          skipTier = tier;
          continue;
        }
        out.push(item);
      }
      return out;
    }

    function applyConfig() {
      // Active module disabled in Config (or missing in current version) →
      // pick the first enabled module; prefer HRM in Combined.
      if (!MODULE_META[activeModule] || !isModuleEnabled(activeModule)) {
        const enabled = Object.keys(MODULE_META).filter(isModuleEnabled);
        activeModule = enabled.includes('hrm') ? 'hrm' : (enabled[0] || 'hrm');
      }

      // Compute visible items for the active module. HRM honours its
      // child toggles; other modules use their item set verbatim.
      if (activeModule === 'hrm') {
        const hidden = new Set();
        const hrmOn = configState.hrm;
        for (const key in HRM_CHILD_LABELS) {
          const effective = hrmOn && configState[key];
          if (!effective) hidden.add(HRM_CHILD_LABELS[key]);
        }
        visibleItems = filterItemsByLabel(HRM_ITEMS, hidden);
      } else {
        visibleItems = MODULE_META[activeModule].items;
      }
      panel.setAttribute('items', JSON.stringify(annotateNewTabs(visibleItems)));
      panel.setAttribute('module-name', MODULE_META[activeModule].name);

      // Module-switcher list = enabled real modules (excluding active) plus
      // the fake modules (no-op decoration), sorted alphabetically together.
      const modules = [];
      for (const mid in MODULE_META) {
        if (mid === activeModule) continue;
        if (!isModuleEnabled(mid)) continue;
        const entry = { id: mid, name: MODULE_META[mid].name };
        // Dottie always opens in a new tab instead of switching in place.
        if (mid === 'dottie') entry.newTab = true;
        modules.push(entry);
      }
      if (configState['fake-context-modules'] !== false) {
        for (const f of FAKE_MODULES) modules.push({ id: f.id, name: f.name, disabled: true });
      }
      modules.sort((a, b) => a.name.localeCompare(b.name));
      panel.setAttribute('modules', JSON.stringify(modules));

      const activeId = panel.getAttribute('active-item');
      if (!activeId || !visibleItems.find(i => i.id === activeId)) {
        const fallback = visibleItems.find(i => i.type === 'link') || { id: MODULE_META[activeModule].defaultId };
        loadPage(fallback.id);
      } else {
        // Active unchanged — refresh breadcrumb (sibling tree may have changed).
        nav.setAttribute('breadcrumbs', JSON.stringify(computeBreadcrumb(activeId)));
      }
    }

    function updateChildEnabledStates() {
      // Native disable only applies in Custom mode; preset-locked uses CSS-only locking.
      const hrmOn = configState.hrm;
      const customMode = currentPreset === 'custom';
      configWidget.querySelectorAll('input[data-cfg^="hrm."]').forEach(cb => {
        cb.disabled = customMode && !hrmOn;
      });
    }

    function syncCheckboxesFromState() {
      configCheckboxes.forEach(cb => {
        const key = cb.dataset.cfg;
        if (key in configState) cb.checked = configState[key];
      });
    }

    function setPreset(newPreset) {
      if (newPreset === currentPreset) return;
      if (newPreset === 'custom') {
        if (customMemory) {
          Object.assign(configState, customMemory);
          customMemory = null;
        }
      } else {
        if (currentPreset === 'custom') {
          customMemory = Object.assign({}, configState);
        }
        Object.assign(configState, PRESETS[newPreset]);
      }
      currentPreset = newPreset;
      syncCheckboxesFromState();
      const radio = configWidget.querySelector(`input[name="preset"][value="${newPreset}"]`);
      if (radio) radio.checked = true;
      configWidget.classList.toggle('preset-locked', newPreset !== 'custom');
      updateChildEnabledStates();
      applyConfig();
    }

    configWidget.querySelectorAll('input[name="preset"]').forEach(r => {
      r.addEventListener('change', () => { if (r.checked) setPreset(r.value); });
    });

    function setVersionMode(newMode) {
      if (newMode === versionMode) return;
      versionMode = newMode;
      MODULE_META = buildModuleMeta();

      // Cross-mode continuity: if the current page exists somewhere in the
      // new mode's module set, switch the active module to whichever owns it;
      // otherwise fall back to the new mode's first module.
      const currentPageId = panel.getAttribute('active-item');
      let owner = null;
      if (currentPageId) {
        for (const [mid, m] of Object.entries(MODULE_META)) {
          if (m.items.find(i => i.id === currentPageId)) { owner = mid; break; }
        }
      }
      if (owner) {
        activeModule = owner;
      } else if (!MODULE_META[activeModule]) {
        activeModule = Object.keys(MODULE_META)[0];
      }

      applyConfig();
    }

    configWidget.querySelectorAll('input[name="version"]').forEach(r => {
      r.addEventListener('change', () => { if (r.checked) setVersionMode(r.value); });
    });

    function flashRow(rowEl) {
      if (!rowEl) return;
      rowEl.classList.remove('flash-pulse');
      void rowEl.offsetWidth; // force reflow so the animation can retrigger
      rowEl.classList.add('flash-pulse');
      rowEl.addEventListener('animationend',
        () => rowEl.classList.remove('flash-pulse'),
        { once: true });
    }

    configCheckboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const key = cb.dataset.cfg;
        const newChecked = cb.checked;

        // Block unchecking the last remaining enabled HRM child; flash parent.
        if (!newChecked && key.startsWith('hrm.') && configState.hrm) {
          const siblings = Array.from(configWidget.querySelectorAll('input[data-cfg^="hrm."]'))
            .filter(other => other !== cb);
          const othersChecked = siblings.some(o => o.checked);
          if (!othersChecked) {
            cb.checked = true;
            flashRow(configWidget.querySelector('[data-row="hrm"]'));
            return;
          }
        }

        configState[key] = newChecked;

        // Clicking a checkbox while a preset is active: accept the toggle
        // and drop back to Custom. The resulting state becomes the new
        // Custom state; no restore from customMemory.
        if (currentPreset !== 'custom') {
          currentPreset = 'custom';
          customMemory = null;
          const customRadio = configWidget.querySelector('input[name="preset"][value="custom"]');
          if (customRadio) customRadio.checked = true;
          configWidget.classList.remove('preset-locked');
        }

        if (key === 'hrm') updateChildEnabledStates();
        applyConfig();
      });
    });

    updateChildEnabledStates();
    // Initial pass — the panel's `modules` attribute starts with whatever the
    // host HTML hard-coded; run applyConfig once to overwrite it with the
    // full list (real modules respecting configState + fake modules).
    applyConfig();

    panel.addEventListener('hrm-panel-close',      () => panel.removeAttribute('open'));
    panel.addEventListener('hrm-nav-item',         (e) => {
      console.log('nav item:', e.detail);
      const id = e.detail.id;
      // Separate-mode: handle specialLink and host-based new-tab cases.
      if (versionMode === 'separate') {
        const item = visibleItems.find(i => i.id === id);
        if (item) {
          if (item.specialLink) {
            // Separate-service link — behaviour pending. Close panel, do nothing else.
            panel.removeAttribute('open');
            return;
          }
          if (item.hostModule && item.hostModule !== activeModule) {
            window.open(`./?page=${encodeURIComponent(id)}&version=separate&module=${encodeURIComponent(item.hostModule)}`, '_blank');
            panel.removeAttribute('open');
            return;
          }
        }
      }
      loadPage(id);
      panel.removeAttribute('open');
    });
    panel.addEventListener('hrm-module-toggle',    () => console.log('module switcher toggled'));
    panel.addEventListener('hrm-module-select',    (e) => {
      const id = e.detail && e.detail.id;
      if (!id) return;
      // Dottie is an external/isolated context in both modes — open in a new
      // tab and close the panel. Combined carries `module=dottie` so the new
      // tab activates Dottie on reload.
      if (id === 'dottie' && activeModule !== 'dottie') {
        const def = MODULE_META.dottie.defaultId;
        const url = versionMode === 'combined'
          ? `./?page=${encodeURIComponent(def)}&version=combined&module=dottie`
          : `./?page=${encodeURIComponent(def)}&version=separate`;
        window.open(url, '_blank');
        panel.removeAttribute('open');
        return;
      }
      if (id !== activeModule && MODULE_META[id]) {
        activeModule = id;
        applyConfig();
        loadPage(MODULE_META[id].defaultId);
        // Separate version: switching modules closes the nav panel.
        if (versionMode === 'separate') panel.removeAttribute('open');
      }
    });
    panel.addEventListener('hrm-profile',          () => console.log('my profile clicked'));
    panel.addEventListener('hrm-logout',           () => console.log('log out clicked'));
    panel.addEventListener('hrm-user-panel-toggle',() => console.log('user panel toggled'));
  </script>

</body>
</html>
